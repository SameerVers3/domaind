[workspace]
members = ["crates/validator"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
config = "0.14"
toml = "0.8"
regex = "1"
jsonschema = "0.18"
