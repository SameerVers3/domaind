name: validate domain registration

on:
  pull_request:
    branches: [main]
    paths:
      - "domains/**"
      - "schema.json"
      - "reserved.json"
      - "blocked.json"
      - "crates/validator/**"
      - "config.toml"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/validator"

      - name: build validator
        run: cargo build --release -p validator

      - name: run validation
        id: run
        run: |
          set +e
          ./target/release/validator > validation_output.txt 2>&1
          exit_code=$?
          cat validation_output.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit $exit_code
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: comment on pr
        if: always()
        run: |
          if [ "${{ steps.run.outputs.exit_code }}" == "0" ]; then
            body="all validations passed"
          else
            body=$(cat validation_output.txt)
          fi

          printf '%s\n' "$body" > comment_body.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment_body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
